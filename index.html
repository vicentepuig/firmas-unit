    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-ink: #101725;
      --color-name: #2B223A;
      --color-bg: #f1f1f1;
      --color-surface: #FFFFFF;
      --color-border: #E2E0DB;
      --color-accent: #101725;
    }

    body {
      font-family: 'EuclidSquare', system-ui, sans-serif;
      font-weight: 400;
      background: var(--color-bg);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 32px 48px 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    header img {
      height: 28px;
      width: auto;
    }

    header h1 {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: var(--color-ink);
      opacity: 0.5;
      letter-spacing: 0.02em;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
    }

    /* FORM */
    .form-panel {
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .form-panel h2 {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-ink);
      opacity: 0.4;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-ink);
      opacity: 0.45;
    }

    .field input,
    .field select {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: var(--color-ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--color-border);
      padding: 10px 0;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
    }

    .field input::placeholder {
      color: var(--color-ink);
      opacity: 0.25;
    }

    .field input:focus,
    .field select:focus {
      border-bottom-color: var(--color-ink);
    }

    .field select {
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23101725' stroke-opacity='0.4' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 4px center;
      padding-right: 20px;
    }

    /* PREVIEW PANEL */
    .preview-panel {
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .preview-panel h2 {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-ink);
      opacity: 0.4;
    }

    .preview-wrapper {
      background: white;
      border: 1px solid var(--color-border);
      padding: 40px 44px;
      display: inline-block;
      max-width: 600px;
    }

    /* SIGNATURE */
    .sig {
      display: table;
      border-collapse: collapse;
      font-family: 'EuclidSquare', Arial, Helvetica, sans-serif;
    }

    .sig-logo-cell {
      display: table-cell;
      vertical-align: middle;
      padding-left: 28px;
    }

    .sig-logo-cell img {
      display: block;
      width: 96px;
      height: auto;
    }

    .sig-info-cell {
      display: table-cell;
      vertical-align: middle;
      padding-right: 28px;
      border-right: 1px solid #9E9BB9;
    }

    .sig-name {
      font-family: 'Reckless', Georgia, serif;
      font-weight: 300;
      font-size: 28px;
      line-height: 1.15;
      color: #2B223A;
      margin-bottom: 8px;
      display: block;
    }

    .sig-meta {
      font-family: 'EuclidSquare', Arial, Helvetica, sans-serif;
      font-weight: 400;
      font-size: 12px;
      line-height: 1.7;
      color: #101725;
      display: block;
    }

    .sig-meta-row {
      display: block;
      color: #101725;
    }

    .sig-dot {
      display: inline-block;
      margin: 0 6px;
      opacity: 0.35;
    }

    .sig-email a {
      color: #101725;
      opacity: 0.8;
      text-decoration: none;
    }

    /* COPY BUTTON */
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      max-width: 600px;
    }

    .btn {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 12px 24px;
      border: 1px solid var(--color-ink);
      background: transparent;
      color: var(--color-ink);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn:hover {
      background: var(--color-ink);
      color: white;
    }

    .btn-primary {
      background: var(--color-ink);
      color: white;
    }

    .btn-primary:hover {
      background: #2B223A;
      border-color: #2B223A;
    }

    .copy-feedback {
      font-size: 12px;
      color: var(--color-ink);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .copy-feedback.visible {
      opacity: 0.5;
    }

    .instructions {
      font-size: 12px;
      line-height: 1.7;
      color: var(--color-ink);
      opacity: 0.45;
      max-width: 480px;
      border-top: 1px solid var(--color-border);
      padding-top: 20px;
    }
  </style>
</head>

  function getValues() {
    return {
      name: document.getElementById('inp-name').value.trim() || 'Nombre Apellido',
      role: document.getElementById('inp-role').value.trim(),
      email: document.getElementById('inp-email').value.trim(),
      country: document.getElementById('inp-country').value,
    };
  }

  function updatePreview() {
    const v = getValues();

    document.getElementById('prev-name').textContent = v.name;

    // Meta row: role · country
    const metaParts = [v.role, v.country].filter(Boolean);
    const metaEl = document.getElementById('prev-meta');
    if (metaParts.length) {
      metaEl.innerHTML = metaParts.map((p, i) =>
        i === 0 ? p : `<span class="sig-dot">—</span>${p}`
      ).join('');
      metaEl.style.display = 'block';
    } else {
      metaEl.innerHTML = '';
      metaEl.style.display = 'none';
    }

    // Email + web
    const emailEl = document.getElementById('prev-email');
    const emailLine = v.email
      ? `<a href="mailto:${v.email}" style="color:#101725;opacity:0.8;text-decoration:none;">${v.email}</a><br>`
      : '';
    emailEl.innerHTML = emailLine + `<a href="https://unit.la" style="color:#101725;opacity:0.8;text-decoration:none;">unit.la</a>`;
    emailEl.style.display = 'block';
  }

  function buildSignatureHTML(v) {
    const metaParts = [v.role, v.country].filter(Boolean);
    const metaRow = metaParts.length
      ? metaParts.join(' <span style="display:inline-block;margin:0 6px;opacity:0.35;">—</span> ')
      : '';

    const emailRow = (v.email
      ? `<br><a href="mailto:${v.email}" style="color:#101725;opacity:0.8;text-decoration:none;font-size:12px;font-family:Arial,Helvetica,sans-serif;">${v.email}</a>`
      : '')
      + `<br><a href="https://unit.la" style="color:#101725;opacity:0.8;text-decoration:none;font-size:12px;font-family:Arial,Helvetica,sans-serif;">unit.la</a>`;

    return `<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td style="vertical-align:middle;padding-right:28px;border-right:1px solid #9E9BB9;">
      <span style="display:block;font-family:Georgia,'Times New Roman',serif;font-weight:300;font-size:28px;line-height:1.15;color:#2B223A;margin-bottom:8px;">${v.name}</span>
      <span style="display:block;font-size:12px;line-height:1.7;color:#101725;font-family:Arial,Helvetica,sans-serif;">${metaRow}${emailRow}</span>
    </td>
    <td style="vertical-align:middle;padding-left:28px;">
      ${SVG_LOGO}
    </td>
  </tr>
</table>`;
  }

  async function downloadPNG() {
    const v = getValues();
    const node = document.getElementById('sig-preview');
    try {
      const canvas = await html2canvas(node, {
        scale: 3,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
      });
      const link = document.createElement('a');
      const slug = v.name.replace(/\s+/g, '-').toLowerCase() || 'firma-unit';
      link.download = `firma-${slug}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showFeedback('PNG descargado');
    } catch (e) {
      showFeedback('Error al generar PNG');
    }
  }

  async function copySignature() {
    const v = getValues();
    const html = buildSignatureHTML(v);

    try {
      const blob = new Blob([html], { type: 'text/html' });
      const item = new ClipboardItem({ 'text/html': blob });
      await navigator.clipboard.write([item]);
      showFeedback('Firma copiada');
    } catch {
      // fallback
      copySignatureHTML();
    }
  }

  async function copySignatureHTML() {
    const v = getValues();
    const html = buildSignatureHTML(v);

    try {
      await navigator.clipboard.writeText(html);
      showFeedback('HTML copiado');
    } catch {
      showFeedback('No se pudo copiar. Intenta en un navegador.');
    }
  }

  function showFeedback(msg) {
    const el = document.getElementById('copy-feedback');
    el.textContent = msg;
    el.classList.add('visible');
    setTimeout(() => el.classList.remove('visible'), 2200);
  }

  // Live updates
  ['inp-name', 'inp-role', 'inp-email', 'inp-country'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', updatePreview);
    el.addEventListener('change', updatePreview);
  });

  updatePreview();
</script>
