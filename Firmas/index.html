<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Firmas — Unit Public Design</title>
  <style>
    @font-face {
      font-family: 'EuclidSquare';
      src: url('fonts/EuclidSquare-Regular.otf') format('opentype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'EuclidSquare';
      src: url('fonts/EuclidSquare-Medium.otf') format('opentype');
      font-weight: 500;
    }
    @font-face {
      font-family: 'EuclidSquare';
      src: url('fonts/EuclidSquare-Semibold.otf') format('opentype');
      font-weight: 600;
    }
    @font-face {
      font-family: 'Reckless';
      src: url('fonts/RecklessStandardM-TRIAL-Thin.otf') format('opentype');
      font-weight: 100;
    }
    @font-face {
      font-family: 'Reckless';
      src: url('fonts/RecklessStandardM-TRIAL-Light.otf') format('opentype');
      font-weight: 300;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-ink: #101725;
      --color-name: #2B223A;
      --color-bg: #f1f1f1;
      --color-surface: #FFFFFF;
      --color-border: #E2E0DB;
      --color-accent: #101725;
    }

    body {
      font-family: 'EuclidSquare', system-ui, sans-serif;
      font-weight: 400;
      background: var(--color-bg);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 32px 48px 24px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    header img {
      height: 28px;
      width: auto;
    }

    header h1 {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: var(--color-ink);
      opacity: 0.5;
      letter-spacing: 0.02em;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
    }

    /* FORM */
    .form-panel {
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .form-panel h2 {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-ink);
      opacity: 0.4;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-ink);
      opacity: 0.45;
    }

    .field input,
    .field select {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: var(--color-ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--color-border);
      padding: 10px 0;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
    }

    .field input::placeholder {
      color: var(--color-ink);
      opacity: 0.25;
    }

    .field input:focus,
    .field select:focus {
      border-bottom-color: var(--color-ink);
    }

    .field select {
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23101725' stroke-opacity='0.4' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 4px center;
      padding-right: 20px;
    }

    /* PREVIEW PANEL */
    .preview-panel {
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .preview-panel h2 {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-ink);
      opacity: 0.4;
    }

    .preview-wrapper {
      background: white;
      border: 1px solid var(--color-border);
      padding: 40px 44px;
      display: inline-block;
      max-width: 600px;
    }

    /* SIGNATURE */
    .sig {
      display: table;
      border-collapse: collapse;
      font-family: 'EuclidSquare', Arial, Helvetica, sans-serif;
    }

    .sig-logo-cell {
      display: table-cell;
      vertical-align: middle;
      padding-left: 28px;
    }

    .sig-logo-cell img {
      display: block;
      width: 96px;
      height: auto;
    }

    .sig-info-cell {
      display: table-cell;
      vertical-align: middle;
      padding-right: 28px;
      border-right: 1px solid #9E9BB9;
    }

    .sig-name {
      font-family: 'Reckless', Georgia, serif;
      font-weight: 300;
      font-size: 28px;
      line-height: 1.15;
      color: #2B223A;
      margin-bottom: 8px;
      display: block;
    }

    .sig-meta {
      font-family: 'EuclidSquare', Arial, Helvetica, sans-serif;
      font-weight: 400;
      font-size: 12px;
      line-height: 1.7;
      color: #101725;
      display: block;
    }

    .sig-meta-row {
      display: block;
      color: #101725;
    }

    .sig-dot {
      display: inline-block;
      margin: 0 6px;
      opacity: 0.35;
    }

    .sig-email a {
      color: #101725;
      opacity: 0.8;
      text-decoration: none;
    }

    /* COPY BUTTON */
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      max-width: 600px;
    }

    .btn {
      font-family: 'EuclidSquare', sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 12px 24px;
      border: 1px solid var(--color-ink);
      background: transparent;
      color: var(--color-ink);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn:hover {
      background: var(--color-ink);
      color: white;
    }

    .btn-primary {
      background: var(--color-ink);
      color: white;
    }

    .btn-primary:hover {
      background: #2B223A;
      border-color: #2B223A;
    }

    .copy-feedback {
      font-size: 12px;
      color: var(--color-ink);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .copy-feedback.visible {
      opacity: 0.5;
    }

    .instructions {
      font-size: 12px;
      line-height: 1.7;
      color: var(--color-ink);
      opacity: 0.45;
      max-width: 480px;
      border-top: 1px solid var(--color-border);
      padding-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <img src="assets/logo-unit-horizontal.svg" alt="Unit Public Design" style="height:22px;width:auto;">
  <h1>Generador de Firmas</h1>
</header>

<div class="layout">

  <!-- FORM -->
  <aside class="form-panel">
    <h2>Datos</h2>

    <div class="field">
      <label>Persona</label>
      <select id="inp-person">
        <option value="">— Selecciona —</option>
      </select>
    </div>

    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="inp-name" placeholder="María González" autocomplete="off">
    </div>

    <div class="field">
      <label>Cargo</label>
      <input type="text" id="inp-role" placeholder="Directora de Diseño" autocomplete="off">
    </div>

    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="inp-email" placeholder="maria@unitpublicdesign.com" autocomplete="off">
    </div>

    <div class="field">
      <label>País</label>
      <select id="inp-country">
        <option value="">— Selecciona —</option>
        <option value="Argentina">Argentina</option>
        <option value="Bolivia">Bolivia</option>
        <option value="Brasil">Brasil</option>
        <option value="Chile">Chile</option>
        <option value="Colombia">Colombia</option>
        <option value="Costa Rica">Costa Rica</option>
        <option value="Cuba">Cuba</option>
        <option value="Ecuador">Ecuador</option>
        <option value="El Salvador">El Salvador</option>
        <option value="España">España</option>
        <option value="Guatemala">Guatemala</option>
        <option value="Honduras">Honduras</option>
        <option value="México">México</option>
        <option value="Nicaragua">Nicaragua</option>
        <option value="Panamá">Panamá</option>
        <option value="Paraguay">Paraguay</option>
        <option value="Perú">Perú</option>
        <option value="República Dominicana">República Dominicana</option>
        <option value="Uruguay">Uruguay</option>
        <option value="Venezuela">Venezuela</option>
        <option value="Otro">Otro</option>
      </select>
    </div>
  </aside>

  <!-- PREVIEW -->
  <main class="preview-panel">
    <h2>Vista previa</h2>

    <div class="preview-wrapper">
      <div id="sig-preview" class="sig">
        <div class="sig-info-cell">
          <span class="sig-name" id="prev-name">Nombre Apellido</span>
          <span class="sig-meta">
            <span class="sig-meta-row" id="prev-meta"></span>
            <span class="sig-email" id="prev-email"></span>
          </span>
        </div>
        <div class="sig-logo-cell">
          <img src="assets/logo-unit-oscuro-compacto.svg" alt="Unit Public Design" width="96">
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="copySignature()">Copiar firma</button>
      <button class="btn" onclick="copySignatureHTML()">Copiar HTML</button>
      <span class="copy-feedback" id="copy-feedback">Copiado al portapapeles</span>
    </div>

    <p class="instructions">
      Haz clic en <strong>Copiar firma</strong> y pégala directamente en la configuración de firma de tu cliente de correo (Gmail, Outlook, Apple Mail). Para clientes que acepten HTML, usa <strong>Copiar HTML</strong>.
    </p>
  </main>

</div>

<script>

    { name: "Zabel Revuelta Pineda",      title: "Strategic Design Consultant" },
    { name: "Vicente Puig",               title: "Visual Designer" },
    { name: "Daniela López Vallejo",      title: "Design and Project Management Consultant" },
    { name: "Florencia Aguirre",          title: "Strategic Design Consultant" },
    { name: "Sofía Bosch Gómez",          title: "Associate Consultant in Service Design" },

    { name: "Silvia Da Rosa",             title: "Associate Consultant in Public Innovation" },
    { name: "Javier Guillot",             title: "Associate Consultant in Innovation and Sustainability" },
    { name: "David Salinas",              title: "Creative Technologist" },
    { name: "Rodrigo Peón-Veiga",         title: "Associate Consultant in Urban Planning" },
    { name: "Rafael Franco",              title: "Strategic Design Consultant" },
    { name: "Angela María Reyes",         title: "Public Innovation Consultant" },
  ];

  // Populate person selector
  const personSelect = document.getElementById('inp-person');
  TEAM.forEach((member, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = member.name;
    personSelect.appendChild(opt);
  });

  personSelect.addEventListener('change', () => {
    const idx = personSelect.value;
    if (idx === '') return;
    const member = TEAM[parseInt(idx)];
    document.getElementById('inp-name').value = member.name;
    document.getElementById('inp-role').value = member.title;
    updatePreview();
  });

  const SVG_LOGO = `<svg width="96" height="48" viewBox="0 0 230 116" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M188.901 76.6317C189.547 76.6317 190.072 77.1748 190.072 77.8418V114.434C190.072 115.101 189.547 115.644 188.901 115.644H178.664C178.019 115.644 177.494 115.101 177.494 114.434V77.8418C177.494 77.1748 178.019 76.6317 178.664 76.6317H188.901Z" fill="#101725"/><path fill-rule="evenodd" clip-rule="evenodd" d="M209.735 76.6317C210.452 76.6317 211.036 77.1748 211.036 77.8418V114.434C211.036 115.101 210.452 115.644 209.735 115.644H198.361C197.644 115.644 197.06 115.101 197.06 114.434V77.8418C197.06 77.1748 197.644 76.6317 198.361 76.6317H209.735Z" fill="#101725"/><path fill-rule="evenodd" clip-rule="evenodd" d="M229.205 67.1047C229.205 67.748 228.663 68.2718 227.999 68.2718H159.134C158.469 68.2718 157.928 67.748 157.928 67.1047V56.8992C157.928 56.256 158.469 55.7321 159.134 55.7321H227.999C228.663 55.7321 229.205 56.256 229.205 56.8992V67.1047Z" fill="#101725"/><path fill-rule="evenodd" clip-rule="evenodd" d="M151.593 43.53C152.169 43.7793 152.468 44.4097 152.283 44.9985L150.938 49.2931C150.775 49.8056 150.291 50.1589 149.744 50.1589H138.215C137.376 50.1589 136.771 49.3692 137.02 48.5865L139.716 39.8796C139.936 39.18 140.733 38.8198 141.423 39.1176L151.6 43.53H151.593Z" fill="#101725"/><path fill-rule="evenodd" clip-rule="evenodd" d="M149.639 55.7321C150.356 55.7321 150.94 56.2882 150.94 56.971V114.405C150.94 115.088 150.356 115.644 149.639 115.644H138.265C137.548 115.644 136.964 115.088 136.964 114.405V56.971C136.964 56.2882 137.548 55.7321 138.265 55.7321H149.639Z" fill="#101725"/><path fill-rule="evenodd" clip-rule="evenodd" d="M120.312 115.637C121.342 115.637 121.951 114.511 121.356 113.687L79.9559 56.4853C79.615 56.0137 79.0564 55.7321 78.4615 55.7321H66.9635C66.2598 55.7321 65.6867 56.2882 65.6867 56.971V114.405C65.6867 115.088 66.2598 115.644 66.9635 115.644H78.1278C78.8315 115.644 79.4046 115.088 79.4   function getValues() {
    return {
      name: document.getElementById('inp-name').value.trim() || 'Nombre Apellido',
      role: document.getElementById('inp-role').value.trim(),
      email: document.getElementById('inp-email').value.trim(),
      country: document.getElementById('inp-country').value,
    };
  }

  function updatePreview() {
    const v = getValues();

    document.getElementById('prev-name').textContent = v.name;

    // Meta row: role · country
    const metaParts = [v.role, v.country].filter(Boolean);
    const metaEl = document.getElementById('prev-meta');
    if (metaParts.length) {
      metaEl.innerHTML = metaParts.map((p, i) =>
        i === 0 ? p : `<span class="sig-dot">—</span>${p}`
      ).join('');
      metaEl.style.display = 'block';
    } else {
      metaEl.innerHTML = '';
      metaEl.style.display = 'none';
    }

    // Email + web
    const emailEl = document.getElementById('prev-email');
    const emailLine = v.email
      ? `<a href="mailto:${v.email}" style="color:#101725;opacity:0.8;text-decoration:none;">${v.email}</a><br>`
      : '';
    emailEl.innerHTML = emailLine + `<a href="https://unit.la" style="color:#101725;opacity:0.8;text-decoration:none;">unit.la</a>`;
    emailEl.style.display = 'block';
  }

  function buildSignatureHTML(v) {
    const metaParts = [v.role, v.country].filter(Boolean);
    const metaRow = metaParts.length
      ? metaParts.join(' <span style="display:inline-block;margin:0 6px;opacity:0.35;">—</span> ')
      : '';

    const emailRow = (v.email
      ? `<br><a href="mailto:${v.email}" style="color:#101725;opacity:0.8;text-decoration:none;font-size:12px;font-family:Arial,Helvetica,sans-serif;">${v.email}</a>`
      : '')
      + `<br><a href="https://unit.la" style="color:#101725;opacity:0.8;text-decoration:none;font-size:12px;font-family:Arial,Helvetica,sans-serif;">unit.la</a>`;

    return `<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td style="vertical-align:middle;padding-right:28px;border-right:1px solid #9E9BB9;">
      <span style="display:block;font-family:Georgia,'Times New Roman',serif;font-weight:300;font-size:28px;line-height:1.15;color:#2B223A;margin-bottom:8px;">${v.name}</span>
      <span style="display:block;font-size:12px;line-height:1.7;color:#101725;font-family:Arial,Helvetica,sans-serif;">${metaRow}${emailRow}</span>
    </td>
    <td style="vertical-align:middle;padding-left:28px;">
      ${SVG_LOGO}
    </td>
  </tr>
</table>`;
  }

  async function copySignature() {
    const v = getValues();
    const html = buildSignatureHTML(v);

    try {
      const blob = new Blob([html], { type: 'text/html' });
      const item = new ClipboardItem({ 'text/html': blob });
      await navigator.clipboard.write([item]);
      showFeedback('Firma copiada');
    } catch {
      // fallback
      copySignatureHTML();
    }
  }

  async function copySignatureHTML() {
    const v = getValues();
    const html = buildSignatureHTML(v);

    try {
      await navigator.clipboard.writeText(html);
      showFeedback('HTML copiado');
    } catch {
      showFeedback('No se pudo copiar. Intenta en un navegador.');
    }
  }

  function showFeedback(msg) {
    const el = document.getElementById('copy-feedback');
    el.textContent = msg;
    el.classList.add('visible');
    setTimeout(() => el.classList.remove('visible'), 2200);
  }

  // Live updates
  ['inp-name', 'inp-role', 'inp-email', 'inp-country'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', updatePreview);
    el.addEventListener('change', updatePreview);
  });

  updatePreview();
</script>

</body>
</html>
